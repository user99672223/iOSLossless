# XcodeGen project definition for LosslessCam.
# Generate the Xcode project with:  xcodegen generate   (brew install xcodegen)
# CI does this automatically; the generated .xcodeproj is not committed.
name: LosslessCam
options:
  bundleIdPrefix: com.losslesscam
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: iphoneos
    SUPPORTS_MACCATALYST: NO
    SDKROOT: iphoneos
    ARCHS: arm64
    VALID_ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu11
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: NO
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_PREVIEWS: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      GCC_OPTIMIZATION_LEVEL: 0
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      GCC_OPTIMIZATION_LEVEL: 3
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  LosslessBridge:
    type: library.static
    platform: iOS
    sources:
      - path: LosslessBridge
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: LosslessBridge
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/LosslessBridge/include
          - $(SRCROOT)/ThirdParty/ffmpeg/include
          - $(SRCROOT)/ThirdParty/xxhash
        OTHER_CFLAGS:
          - -fno-strict-aliasing
          - -Wno-deprecated-declarations
        SKIP_INSTALL: YES

  LosslessCam:
    type: application
    platform: iOS
    sources:
      - path: LosslessCam
        excludes:
          - "**/.DS_Store"
    info:
      path: LosslessCam/Info.plist
    dependencies:
      - target: LosslessBridge
        embed: false
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: VideoToolbox.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Accelerate.framework
      - sdk: QuartzCore.framework
      - sdk: libcompression.tbd
      - sdk: libbz2.tbd
      - sdk: libz.tbd
      - sdk: libiconv.tbd
    settings:
      base:
        PRODUCT_NAME: LosslessCam
        PRODUCT_BUNDLE_IDENTIFIER: com.losslesscam.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: LosslessCam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: LosslessCam/LosslessCam-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/LosslessBridge/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/ThirdParty/ffmpeg/lib
        OTHER_LDFLAGS:
          - -lffmpeg
          - -ObjC
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        MTL_ENABLE_DEBUG_INFO: NO
        MTL_FAST_MATH: YES
        OTHER_SWIFT_FLAGS:
          - -Xcc
          - -I$(SRCROOT)/LosslessBridge/include

schemes:
  LosslessCam:
    build:
      targets:
        LosslessCam: all
        LosslessBridge: all
    run:
      config: Debug
    archive:
      config: Release
