name: SDK header probe (temporary)

on:
  push:
    branches: ["claude/compassionate-curie-qn8xjo"]
    paths: [".github/workflows/sdk-probe.yml"]

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Print AVFoundation capture declarations from the iOS SDK
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_*.app | grep -v -i -E 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          H="$SDK/System/Library/Frameworks/AVFoundation.framework/Headers"
          echo "===== AVCaptureAudioDataOutput.h ====="
          cat "$H/AVCaptureAudioDataOutput.h"
          echo "===== multichannel in AVCaptureInput.h ====="
          grep -n -i -B4 -A30 "multichannelAudioMode" "$H/AVCaptureInput.h" | head -220
          echo "===== spatialAudio / Ambisonics anywhere ====="
          grep -rn -i "spatialAudio\|Ambisonic\|HOA_ACN" "$H" | head -80
          echo "===== beginConfiguration / commitConfiguration ====="
          grep -n -B2 -A25 "beginConfiguration\|commitConfiguration" "$H/AVCaptureSession.h" | head -160
          echo "===== stabilization modes ====="
          grep -n -B3 -A12 "AVCaptureVideoStabilizationMode" "$H/AVCaptureSession.h" "$H/AVCaptureDevice.h" | head -200
          echo "===== HOA tag in CoreAudioTypes ====="
          CAT="$SDK/System/Library/Frameworks/CoreAudioTypes.framework/Headers/CoreAudioBaseTypes.h"
          grep -n "HOA_ACN\|kAudioChannelLayoutTag_Stereo \|kAudioChannelLayoutTag_Unknown" "$CAT" | head -20
